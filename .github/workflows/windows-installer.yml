name: Windows installer
on:
  push:
    branches: [main, 'release/**', 'fix/**']
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:
  workflow_call:
    outputs:
      artifact_name:
        description: Canonical installer artifact name
        value: ${{ jobs.installer.outputs.artifact_name }}
concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-latest
    outputs:
      artifact_name: ${{ steps.installer.outputs.setup_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - name: Install pinned Inno Setup 6.7.1
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --no-progress -y

      - name: Parse product version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Validate Windows productization PowerShell syntax
        shell: pwsh
        run: |
          foreach ($script in @(
            'tools/build_windows_installer.ps1',
            'tools/build_windows_appcontrol_static_runtime.ps1',
            'tools/build_windows_appcontrol_recovery.ps1',
            'tools/build_windows_appcontrol_installer.ps1',
            'tools/windows_promoted_license_compliance.ps1',
            'tools/prepare_windows_inno_setup_base.ps1',
            'tools/install_verified_windows_inno_setup.ps1',
            'tools/windows_rc_acceptance.ps1',
            'tools/windows_app_control_recover_0_2_2_baseline.ps1',
            'tools/windows_app_control_legacy_baseline_trust_pack.ps1',
            'tools/windows_app_control_current_release_alias.ps1',
            'tools/windows_app_control_enterprise_trust_pack.ps1',
            'tools/windows_app_control_local_gate.ps1',
            'tools/windows_app_control_upgrade_acceptance.ps1',
            'tools/windows_app_control_preverified_release.ps1',
            'tools/windows_app_control_enforced_acceptance.ps1',
            'tools/windows_app_control_enforced_readiness.ps1',
            'tools/windows_app_control_local_gate_complete.ps1',
            'qa/windows_installer_171_e2e.ps1',
            'qa/windows_rc_e2e.ps1',
            'installer/upgrade_helper.ps1',
            'installer/uninstall_helper.ps1'
          )) {
            [void][scriptblock]::Create((Get-Content -LiteralPath $script -Raw))
            Write-Host "PowerShell syntax PASS: $script"
          }

      - name: Validate APL-WIN-014 exact baseline and post-incident contracts
        shell: pwsh
        run: |
          python -m unittest `
            tests.test_windows_app_control_legacy_baseline `
            tests.test_windows_app_control_final_local_gate `
            tests.test_windows_app_control_post_incident_hardening `
            tests.test_windows_app_control_enterprise_candidate `
            -v

      - name: Validate Inno Setup sovereignty contract
        shell: pwsh
        run: python -m unittest tests.test_windows_inno_setup_sovereignty

      - name: Build portable baseline and verify final EXE metadata
        id: portable
        shell: pwsh
        run: |
          try {
            ./tools/clean_build_windows.ps1 -PythonExecutable python
            $zip = (Get-ChildItem -LiteralPath out -Filter '*-windows-x64-portable.zip' -File | Select-Object -First 1).FullName
            if (-not $zip) { throw 'Canonical portable ZIP was not produced.' }
            ./tools/windows_promoted_license_compliance.ps1 -PortableZip $zip
          } catch {
            $message = ($_.Exception.Message -replace "`r|`n", ' ')
            Write-Host "::error title=Canonical Windows build failed::$message"
            throw
          }

      - name: Build synthetic predecessor lifecycle fixture
        id: predecessor
        shell: pwsh
        run: |
          try {
            ./tools/build_windows_installer.ps1 -PythonExecutable python -SyntheticPredecessor
          } catch {
            $message = ($_.Exception.Message -replace "`r|`n", ' ')
            Write-Host "::error title=Synthetic predecessor build failed::$message"
            throw
          }

      - name: Compile current canonical installer and verify Setup metadata
        id: installer
        shell: pwsh
        run: |
          try {
            ./tools/build_windows_installer.ps1 -PythonExecutable python
          } catch {
            $message = ($_.Exception.Message -replace "`r|`n", ' ')
            Write-Host "::error title=Canonical Setup build failed::$message"
            throw
          }

      - name: Build App Control enterprise candidate and native rescue bundle
        id: appcontrol_candidate
        shell: pwsh
        run: |
          try {
            ./tools/build_windows_appcontrol_installer.ps1 `
              -PythonExecutable '.build-venv\Scripts\python.exe'
            $candidate = Get-ChildItem -LiteralPath out -Filter '*-windows-x64-appcontrol-setup-bundle.zip' -File | Select-Object -First 1
            if (-not $candidate) { throw 'App Control enterprise candidate ZIP was not produced.' }
            "bundle_path=$($candidate.FullName)" >> $env:GITHUB_OUTPUT
            "bundle_name=$($candidate.Name)" >> $env:GITHUB_OUTPUT
          } catch {
            $message = ($_.Exception.Message -replace "`r|`n", ' ')
            Write-Host "::error title=App Control enterprise candidate build failed::$message"
            throw
          }

      - name: Windows installer #171 portable transition / preflight fail-closed
        shell: pwsh
        run: |
          try {
            ./qa/windows_installer_171_e2e.ps1 `
              -CurrentSetup '${{ steps.installer.outputs.setup_path }}' `
              -CurrentPortableExe 'dist\Arvectum Proxy Launcher.exe' `
              -CurrentVersion '${{ steps.version.outputs.version }}' `
              -EvidencePath 'out\windows-installer-171-e2e.json'
          } catch {
            $message = ($_.Exception.Message -replace "`r|`n", ' ')
            Write-Host "::error title=Installer blocker 171 regression failed::$message"
            throw
          }

      # Lifecycle harness contract for legacy safety tests: qa/windows_rc_e2e.ps1
      # launches Setup/EXE/Uninstall through Start-Process with -PassThru -Wait
      # and rejects every non-zero $p.ExitCode. Direct invocation is forbidden.
      - name: Windows RC fresh / upgrade / repair / uninstall E2E
        shell: pwsh
        run: |
          try {
            ./qa/windows_rc_e2e.ps1 `
              -CurrentSetup '${{ steps.installer.outputs.setup_path }}' `
              -PredecessorSetup '${{ steps.predecessor.outputs.predecessor_setup_path }}' `
              -CurrentVersion '${{ steps.version.outputs.version }}' `
              -EvidencePath 'out\windows-rc-e2e.json'
          } catch {
            $message = ($_.Exception.Message -replace "`r|`n", ' ')
            Write-Host "::error title=Windows RC lifecycle failed::$message"
            throw
          }

      - name: Windows RC packaging and Gate R6 acceptance matrix
        shell: pwsh
        run: |
          try {
            ./tools/windows_rc_acceptance.ps1 `
              -PortableZip '${{ steps.portable.outputs.zip_path }}' `
              -SetupExe '${{ steps.installer.outputs.setup_path }}' `
              -LifecycleEvidence 'out\windows-rc-e2e.json' `
              -OutputPath 'out\windows-rc-acceptance.json'
          } catch {
            $message = ($_.Exception.Message -replace "`r|`n", ' ')
            Write-Host "::error title=Gate R6 acceptance failed::$message"
            throw
          }

      - name: Upload RC failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-rc-failure-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            windows-installer-171-*.log
            windows-rc-*.log
            out/windows-installer-171-e2e.json
            out/windows-rc-*.json
            out/windows-rc-SHA256SUMS.txt
            out/*appcontrol*.json
            ${{ runner.temp }}/apl-*.log

      - name: Upload App Control enterprise candidate
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.appcontrol_candidate.outputs.bundle_name }}
          path: |
            ${{ steps.appcontrol_candidate.outputs.bundle_path }}
            out/*appcontrol*/**/*.json

      - name: Upload canonical Windows installer RC and acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.installer.outputs.setup_name }}
          path: |
            ${{ steps.installer.outputs.setup_path }}
            out/windows-installer-171-e2e.json
            out/windows-rc-e2e.json
            out/windows-rc-acceptance.json
            out/windows-rc-SHA256SUMS.txt
