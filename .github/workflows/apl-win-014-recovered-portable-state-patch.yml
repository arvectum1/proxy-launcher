name: APL-WIN-014 recovered portable state patch

on:
  push:
    branches: [apl-win-014-appcontrol-hardening]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apl-win-014-appcontrol-hardening
          fetch-depth: 0

      - name: Patch stand driver and regression contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'tools\windows_app_control_candidate_stand.ps1'
          $text = Get-Content -LiteralPath $path -Raw -Encoding UTF8

          $patternCurrent = '(?s)function Assert-Sealed023CurrentHealthy \{.*?\r?\n\}\r?\n\r?\nfunction Assert-CandidateInstalled'
          $replacementCurrent = @'
function Resolve-Current023Healthy {
    foreach ($name in @('proxy_settings.json','no_proxy.txt')) {
        if (-not (Test-Path -LiteralPath (Join-Path $StateRoot $name) -PathType Leaf)) {
            throw "Exact current durable state missing: $name"
        }
    }

    $healthy = @()
    foreach ($listener in @(Get-NetTCPConnection -LocalPort 8082 -State Listen -ErrorAction SilentlyContinue)) {
        $owner = @(Get-CimInstance Win32_Process -Filter "ProcessId=$([int]$listener.OwningProcess)" -ErrorAction SilentlyContinue)
        if ($owner.Count -ne 1 -or -not $owner[0].ExecutablePath) { continue }
        $exe = [string]$owner[0].ExecutablePath
        if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { continue }
        if ((Hash $exe) -ne $ExpectedSealed023AppSha256) { continue }
        $health = Get-PacHealth $exe
        if ($health) {
            $healthy += [pscustomobject]@{ exe=$exe; health=$health }
        }
    }

    $healthy = @($healthy | Sort-Object -Property exe -Unique)
    if ($healthy.Count -ne 1) {
        throw "Expected exactly one healthy exact sealed 0.2.3 runtime owning PAC; found $($healthy.Count)."
    }

    $current = $healthy[0]
    $mode = 'PORTABLE_RECOVERY'
    $uninstaller = $null
    if ([IO.Path]::GetFullPath([string]$current.exe) -ieq [IO.Path]::GetFullPath($Sealed023Exe)) {
        $uninstallers = @(Get-ChildItem -LiteralPath $InstallRoot -File -Filter 'unins*.exe' -ErrorAction SilentlyContinue)
        if ($uninstallers.Count -ne 1) {
            throw "Installed exact sealed 0.2.3 must have exactly one Inno uninstaller; found $($uninstallers.Count)."
        }
        $mode = 'INSTALLED'
        $uninstaller = $uninstallers[0].FullName
    }

    [pscustomobject]@{
        mode = $mode
        exe = [string]$current.exe
        uninstaller = $uninstaller
        health = $current.health
    }
}

function Assert-CandidateInstalled
'@
          $next = [regex]::Replace($text, $patternCurrent, $replacementCurrent, 1)
          if ($next -eq $text) { throw 'Failed to replace current 0.2.3 health contract.' }
          $text = $next

          $patternRemove = '(?s)function Remove-CurrentInstallAfterRollback \{.*?\r?\n\}\r?\n\r?\nfunction Install-Historical022UnderEnforced'
          $replacementRemove = @'
function Remove-Current023AfterRollback([object]$Current) {
    if (-not $Current -or [string]$Current.mode -notin @('INSTALLED','PORTABLE_RECOVERY')) {
        throw 'Current exact 0.2.3 state is missing or unsupported.'
    }

    Invoke-BoundedRollback ([string]$Current.exe) 20
    Stop-ExactProcesses ([string]$Current.exe)

    if ([string]$Current.mode -eq 'INSTALLED') {
        $uninstaller = [string]$Current.uninstaller
        if (-not $uninstaller -or -not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) {
            throw 'Installed exact sealed 0.2.3 uninstaller disappeared after preflight.'
        }
        $p = Start-Process -FilePath $uninstaller -WorkingDirectory $InstallRoot -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',("/LOG=$(Join-Path $EvidenceRoot 'sealed-023-pre-lifecycle-uninstall.log')")) -PassThru -Wait
        if ($p.ExitCode -ne 0) { throw "Sealed 0.2.3 uninstall failed with exit code $($p.ExitCode)." }
    }

    Remove-Item -LiteralPath $StateRoot -Recurse -Force -ErrorAction SilentlyContinue
    if ([string]$Current.mode -eq 'INSTALLED' -and (Test-Path -LiteralPath $InstallRoot -PathType Container)) {
        $left = @(Get-ChildItem -LiteralPath $InstallRoot -Force -ErrorAction SilentlyContinue)
        if ($left.Count -eq 0) { Remove-Item -LiteralPath $InstallRoot -Force }
    }
    if (@(Get-NetTCPConnection -LocalPort 8082 -State Listen -ErrorAction SilentlyContinue).Count -gt 0) {
        throw 'TCP 8082 is not free after exact current 0.2.3 rollback/cleanup.'
    }
}

function Install-Historical022UnderEnforced
'@
          $next = [regex]::Replace($text, $patternRemove, $replacementRemove, 1)
          if ($next -eq $text) { throw 'Failed to replace current 0.2.3 cleanup contract.' }
          $text = $next

          $oldPreflight = @'
    $health = Assert-Sealed023CurrentHealthy
'@
          $newPreflight = @'
    $current = Resolve-Current023Healthy
    $health = $current.health
'@
          if (-not $text.Contains($oldPreflight)) { throw 'Preflight current-state call not found.' }
          $text = $text.Replace($oldPreflight, $newPreflight)

          $oldRecord = '        native_recovery_sha256=Hash $inputs.recovery_exe;current_sealed_023_sha256=Hash $Sealed023Exe'
          $newRecord = '        native_recovery_sha256=Hash $inputs.recovery_exe;current_sealed_023_sha256=Hash $current.exe;current_runtime_mode=[string]$current.mode;current_runtime_path=[string]$current.exe'
          if (-not $text.Contains($oldRecord)) { throw 'Preflight evidence current hash line not found.' }
          $text = $text.Replace($oldRecord, $newRecord)

          $oldReturn = '[pscustomobject]@{host=$hostInfo;kit=$kit;inputs=$inputs;policy=$policy;prepared=$prepared;health=$health}'
          $newReturn = '[pscustomobject]@{host=$hostInfo;kit=$kit;inputs=$inputs;policy=$policy;prepared=$prepared;current=$current;health=$health}'
          if (-not $text.Contains($oldReturn)) { throw 'Preflight context return not found.' }
          $text = $text.Replace($oldReturn, $newReturn)

          if (-not $text.Contains('        Remove-CurrentInstallAfterRollback')) { throw 'Execute cleanup call not found.' }
          $text = $text.Replace('        Remove-CurrentInstallAfterRollback', '        Remove-Current023AfterRollback $context.current')

          $oldOutput = "    Write-Host 'CURRENT SEALED 0.2.3 + PAC: HEALTHY'"
          $newOutput = '    Write-Host "CURRENT EXACT 0.2.3 ($([string]$preflight.current.mode)) + PAC: HEALTHY"'
          if (-not $text.Contains($oldOutput)) { throw 'Preflight output line not found.' }
          $text = $text.Replace($oldOutput, $newOutput)

          Set-Content -LiteralPath $path -Value $text -Encoding utf8

          $test = @'
from pathlib import Path
import re
import unittest

TEXT = Path("tools/windows_app_control_candidate_stand.ps1").read_text(encoding="utf-8-sig")

class RecoveredPortableCurrentStateContract(unittest.TestCase):
    def test_preflight_resolves_active_exact_current_runtime(self):
        self.assertIn("function Resolve-Current023Healthy", TEXT)
        self.assertIn("PORTABLE_RECOVERY", TEXT)
        self.assertIn("$current = Resolve-Current023Healthy", TEXT)
        self.assertIn("current_runtime_mode=[string]$current.mode", TEXT)
        self.assertIn("current_runtime_path=[string]$current.exe", TEXT)

    def test_execute_cleans_installed_or_portable_current_state(self):
        self.assertIn("function Remove-Current023AfterRollback", TEXT)
        self.assertIn("Remove-Current023AfterRollback $context.current", TEXT)
        self.assertIn("[string]$Current.mode -eq 'INSTALLED'", TEXT)
        self.assertIn("PORTABLE_RECOVERY", TEXT)

    def test_preflight_no_longer_requires_installed_uninstaller(self):
        block = re.search(r"function Resolve-Current023Healthy \{(?P<body>.*?)\n\}\n\nfunction Assert-CandidateInstalled", TEXT, re.S)
        self.assertIsNotNone(block)
        body = block.group("body")
        self.assertIn("Get-NetTCPConnection -LocalPort 8082", body)
        self.assertIn("Hash $exe", body)
        self.assertIn("if ([IO.Path]::GetFullPath", body)
        self.assertIn("unins*.exe", body)

if __name__ == "__main__":
    unittest.main()
'@
          Set-Content -LiteralPath 'tests\test_windows_app_control_recovered_portable_state.py' -Value $test -Encoding utf8

          $newStandHash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          $harness = '.github\workflows\windows-appcontrol-harness-trust.yml'
          $harnessText = Get-Content -LiteralPath $harness -Raw -Encoding UTF8
          $oldStandHash = '4cc50bfb55bb5b1773c7a39468e11d53b2d87a05247b23babf40af33be529f1f'
          if (-not $harnessText.Contains($oldStandHash)) { throw 'Old stand-driver hash not found in harness workflow.' }
          $harnessText = $harnessText.Replace($oldStandHash, $newStandHash)
          $harnessText = $harnessText.Replace("target_stand_kit_source_commit = 'ce9718ff460364020fd90cf7513b8f97728638fd'", "target_stand_kit_source_commit = '${{ github.event.pull_request.head.sha }}'")
          $harnessText = $harnessText.Replace("target_stand_kit_zip_sha256 = '246b14064f3e32070a8498d4f7c848660f3c7f4dc0b61806346e9d3a8b03f116'", "target_stand_kit_zip_sha256 = $null")
          Set-Content -LiteralPath $harness -Value $harnessText -Encoding utf8

          Write-Host "Patched stand driver SHA256: $newStandHash"

      - name: Validate patch
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'tools\windows_app_control_candidate_stand.ps1').Path,[ref]$tokens,[ref]$errors)
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          python -m unittest tests.test_windows_app_control_recovered_portable_state -v

      - name: Commit patch and remove one-shot workflow
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/apl-win-014-recovered-portable-state-patch.yml'
          git add tools/windows_app_control_candidate_stand.ps1 tests/test_windows_app_control_recovered_portable_state.py .github/workflows/windows-appcontrol-harness-trust.yml
          git commit -m 'fix: accept recovered portable 0.2.3 stand state'
          git push origin HEAD:apl-win-014-appcontrol-hardening
