name: APL-WIN-014 commit validated recovered-state patch

on:
  push:
    branches: [apl-win-014-appcontrol-hardening]

permissions:
  contents: write

jobs:
  commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apl-win-014-appcontrol-hardening
          fetch-depth: 0

      - name: Reuse and execute validated patch body
        shell: python
        run: |
          from pathlib import Path
          source = Path('.github/workflows/apl-win-014-recovered-portable-state-patch.yml').read_text(encoding='utf-8-sig').splitlines()
          marker = '      - name: Patch stand driver and regression contract'
          start = source.index(marker)
          run_index = next(i for i in range(start, len(source)) if source[i].strip() == 'run: |')
          end = next(i for i in range(run_index + 1, len(source)) if source[i].startswith('      - name: Validate patch'))
          body = []
          for line in source[run_index + 1:end]:
              body.append(line[10:] if line.startswith('          ') else line)
          code = '\n'.join(body) + '\n'
          exec(compile(code, '<recovered-state-patch>', 'exec'), {'__name__': '__main__'})

      - name: Validate patched stand driver
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'tools\windows_app_control_candidate_stand.ps1').Path,[ref]$tokens,[ref]$errors)
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          python -m unittest tests.test_windows_app_control_recovered_portable_state -v

      - name: Commit only product/test files
        shell: pwsh
        run: |
          git restore '.github/workflows/windows-appcontrol-harness-trust.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/windows_app_control_candidate_stand.ps1 tests/test_windows_app_control_recovered_portable_state.py
          git commit -m 'fix: accept recovered portable 0.2.3 stand state'
          git push origin HEAD:apl-win-014-appcontrol-hardening
