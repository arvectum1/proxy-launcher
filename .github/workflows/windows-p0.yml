name: Windows P0 portable

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - name: Run canonical Windows clean build
        id: clean_build
        shell: pwsh
        run: |
          ./tools/clean_build_windows.ps1 -PythonExecutable python

      - name: APL-IP-004 promoted portable license gate
        shell: pwsh
        run: |
          ./tools/windows_promoted_license_compliance.ps1 -PortableZip '${{ steps.clean_build.outputs.zip_path }}'

      - name: Windows Documents execution smoke
        shell: pwsh
        run: |
          $builtRuntime = (Resolve-Path -LiteralPath 'dist/Arvectum Proxy Launcher').Path
          $builtExe = Join-Path $builtRuntime 'Arvectum Proxy Launcher.exe'
          $canonicalDir = Join-Path $env:USERPROFILE 'Documents\ArvectumProxyLauncher'
          if (Test-Path -LiteralPath $canonicalDir) {
            Remove-Item -LiteralPath $canonicalDir -Recurse -Force
          }
          Copy-Item -LiteralPath $builtRuntime -Destination $canonicalDir -Recurse -Force
          $canonicalExe = Join-Path $canonicalDir 'Arvectum Proxy Launcher.exe'
          if (-not (Test-Path -LiteralPath $canonicalExe -PathType Leaf)) {
            throw 'Canonical onedir runtime copy is missing the Launcher executable.'
          }

          $builtFiles = @(Get-ChildItem -LiteralPath $builtRuntime -File -Recurse -Force)
          $canonicalFiles = @(Get-ChildItem -LiteralPath $canonicalDir -File -Recurse -Force)
          if ($builtFiles.Count -ne $canonicalFiles.Count) {
            throw "Canonical onedir file-count mismatch: built=$($builtFiles.Count) canonical=$($canonicalFiles.Count)"
          }
          foreach ($source in $builtFiles) {
            $relative = [IO.Path]::GetRelativePath($builtRuntime, $source.FullName)
            $target = Join-Path $canonicalDir $relative
            if (-not (Test-Path -LiteralPath $target -PathType Leaf)) {
              throw "Canonical onedir copy missing runtime file: $relative"
            }
            $sourceHash = (Get-FileHash -LiteralPath $source.FullName -Algorithm SHA256).Hash
            $targetHash = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash
            if ($sourceHash -ne $targetHash) {
              throw "Canonical onedir runtime hash mismatch: $relative"
            }
          }

          $p = Start-Process -FilePath $canonicalExe -ArgumentList '--status' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Documents EXE smoke failed with exit code $($p.ExitCode)" }
          Write-Host "Documents onedir execution smoke PASS; files=$($canonicalFiles.Count)"

          $doctorReport = Join-Path $env:RUNNER_TEMP 'apl-diag-004-packaged-doctor.json'
          if (Test-Path -LiteralPath $doctorReport) { Remove-Item -LiteralPath $doctorReport -Force }
          $doctor = Start-Process -FilePath $canonicalExe -ArgumentList @('--doctor-json', $doctorReport) -PassThru -Wait
          if ($doctor.ExitCode -notin @(0,1,2)) {
            throw "Packaged Doctor smoke failed with unexpected exit code $($doctor.ExitCode)"
          }
          if (-not (Test-Path -LiteralPath $doctorReport)) { throw 'Packaged Doctor JSON was not created' }
          $doctorJson = Get-Content -LiteralPath $doctorReport -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($doctorJson.schema -ne 'arvectum.proxy.doctor.v1') { throw 'Unexpected packaged Doctor schema' }
          if ([int]$doctorJson.exit_code -ne $doctor.ExitCode) { throw 'Packaged Doctor exit_code mismatch' }
          Remove-Item -LiteralPath $doctorReport -Force
          Write-Host "Packaged Doctor smoke PASS; status=$($doctorJson.overall); exit=$($doctor.ExitCode)"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.clean_build.outputs.artifact_name }}
          path: ${{ steps.clean_build.outputs.zip_path }}
